<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale comigo</title>
    <link rel="stylesheet" href="falecomigo.css">
</head>
<body>
    

        <div id="container">
                    <h1>Me envie uma mensagem</h1>
        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="name" name="nome" required><br>

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="mensagem">Digite sua mensagem</label>
            <textarea name="mensagem" id="mensagem"></textarea><br><br>

            <label for="seletor">O tempo da sua resposta vai variar de acordo com a sua resposta</label>
            <select name="2026" id="2026" required>
                <option value="bolsonaro">Bolsonaro</option>
                <option value="lula">Lula</option>
            </select>
            <button type="submit">Enviar</button>
        </form>
        </div>



</body>
</html>
